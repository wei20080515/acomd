<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人記帳系統</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 自訂 CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">個人記帳系統</h1>
        
        <!-- 新增交易表單 -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">新增交易</h5>
                <form id="transactionForm">
                    <div class="mb-3">
                        <label for="description" class="form-label">描述</label>
                        <input type="text" class="form-control" id="description" required>
                    </div>
                    <div class="mb-3">
                        <label for="amount" class="form-label">金額</label>
                        <input type="number" class="form-control" id="amount" required>
                    </div>
                    <div class="mb-3">
                        <label for="type" class="form-label">類型</label>
                        <select class="form-select" id="type" required>
                            <option value="expense">支出</option>
                            <option value="income">收入</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">新增</button>
                </form>
            </div>
        </div>

        <!-- 收支統計 -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title">總收入</h5>
                        <p class="card-text" id="totalIncome">NT$ 0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title">總支出</h5>
                        <p class="card-text" id="totalExpense">NT$ 0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title">結餘</h5>
                        <p class="card-text" id="balance">NT$ 0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 圖表 -->
        <div class="card mb-4">
            <div class="card-body">
                <canvas id="transactionChart"></canvas>
            </div>
        </div>

        <!-- 交易紀錄表格 -->
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">交易紀錄</h5>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>日期</th>
                                <th>描述</th>
                                <th>類型</th>
                                <th>金額</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="transactionList">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 自訂 JS -->
    <script src="script.js"></script>
</body>
</html>
